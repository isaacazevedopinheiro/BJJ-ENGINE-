<script>

  function obterDadosdaDash() {
    fetch(`/formulario/Dashboard1`, { cache: 'no-store' }).then(function (response) {
      if (response.ok) {
        response.json().then(function (resposta) {
          console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
          console.log(resposta);
          resposta.reverse();
          plotarDadosnaDash(resposta)
          // plotarGrafico(resposta, idAquario);

        });
      } else {
        console.error('Nenhum dado encontrado ou erro na API');
      }
    })
      .catch(function (error) {
        console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
      });
  }

  function plotarDadosnaDash(resposta) {

    const ctx = document.getElementById('barra');

    let lista = []
    let lista2 = []
    for (let i = 0; i < resposta.length; i++) {
      lista.push(resposta[i].quantidade_de_resposta)
      lista2.push(resposta[i].resposta)
    }

    new Chart(ctx, {
  type: 'bar',
  data: {
    labels: lista2,
    datasets: [{
      label: 'Quantidade de Usuarios por Tipo',
      data: lista,
      backgroundColor: [
        'red',
        'white',
        '#990000',
        'grey'
      ],
      borderColor: [
        'white',
        'white',
        'white',
        'white'
      ],
      borderWidth: 1,
      borderRadius: 10
    }]
  },
  // aqui tem as barrinhas
  options: {
    plugins: {
      legend: {
        labels: {
          color: 'white'
        }
      }
    },

    scales: {
      x: {
        ticks: {
          color: 'white'
        },

        grid: {
          color: '#333'
        }
      },
      y: {
        beginAtZero: true,
        ticks: {
          color: 'white'
        },
        grid: {
          color: '#333'
        }
      }
    }
  }
});

    
  
  }
