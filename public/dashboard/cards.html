<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJJ ENGINE - Meu Perfil</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />

    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@100;300;400;600;700;900&display=swap" rel="stylesheet">
</head>

<body onload="validarSessao(), carregarPerfilDoUsuario()">

    <div class="janela">
        
        <div class="header-left">
            <h1>BJJ <span>Engine</span></h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav">
                <h3>Meu Perfil</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <h3>Dashboard</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="../formulario.html">
                   <h3>Formulário</h3> 
                </a> 
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        </div>

        <div class="dash">
            <div id="resultado_perfil" class="card-aquario" style="width: 80%; margin: 40px auto; padding: 20px; text-align: center; background-color: #212124; border-radius: 10px; color: white;">
                </div>
        </div>

    </div>

</body>

<script>
    // lê o clique do formulário 
    function carregarPerfilDoUsuario() {
        // Busca o nome do usuário para atualizar o cabeçalho lateral
        document.getElementById("b_usuario").innerHTML = sessionStorage.NOME_USUARIO;

        // Recupera qual estilo de luta foi calculado e salvo na sessão
        let ultimoEstilo = sessionStorage.ESTILO_ATUAL;
        let containerPerfil = document.getElementById("resultado_perfil");

        let htmlzao = "";

        if (ultimoEstilo === "Pressão") {
            htmlzao = `
                <h2>Seu Estilo Dominante: Pressão</h2>
                <br>
                <center><img src="../assets/midia/pressao.png" width="300" height="400" style="border-radius: 8px; border: 2px solid #5d1212;"></center>
                <br>
                <p><b>Perfil Tático:</b> Passador / Quedador</p>
                <p><b>Finalizações Favoritas:</b> Mata-leão ou Americana</p>
            `;
        } else if (ultimoEstilo === "Estratégico") {
            htmlzao = `
                <h2>Seu Estilo Dominante: Estratégico</h2>
                <br>
                <center><img src="../assets/midia/estrategico.png" width="300" height="400" style="border-radius: 8px; border: 2px solid #12405d;"></center>
                <br>
                <p><b>Perfil Tático:</b> Defensivo Técnico</p>
                <p><b>Finalizações Favoritas:</b> Triângulo ou Arm-lock</p>
            `;
        } else if (ultimoEstilo === "Flexivel") {
            htmlzao = `
                <h2>Seu Estilo Dominante: Flexivel</h2>
                <br>
                <center><img src="../assets/midia/flexivel.png" width="300" height="400" style="border-radius: 8px; border: 2px solid #125d2c;"></center>
                <br>
                <p><b>Perfil Tático:</b> Guarda / Escapador</p>
                <p><b>Finalizações Favoritas:</b> Triângulo ou Chave de perna</p>
            `;
        } else if (ultimoEstilo === "Finalizador") {
            htmlzao = `
                <h2>Seu Estilo Dominante: Finalizador</h2>
                <br>
                <center><img src="../assets/midia/finalizador.png" width="300" height="400" style="border-radius: 8px; border: 2px solid #56125d;"></center>
                <br>
                <p><b>Perfil Tático:</b> Caçador de finalizações</p>
                <p><b>Finalizações Favoritas:</b> Guilhotina ou Mata-leão</p>
            `;
        } else {
            // Tratamento caso ele clique em "Meu Perfil" antes de responder o quiz pela primeira vez
            htmlzao = `
                <h2>Você ainda não calculou o seu perfil</h2>
                <br>
                <p>Responda às 10 perguntas do nosso questionário IRADO para saber seu perfil</p>
                
            `;
        }

        // Renderiza o bloco de texto e imagens na div do perfil
        containerPerfil.innerHTML = htmlzao;
    }
</script>

</html>
